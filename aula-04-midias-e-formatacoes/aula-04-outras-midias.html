<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outras mídias no HTML5</title>
</head>
<body>
    <header>
        <h1>Outras mídias no HTML5</h1>
    </header>
    <main>
        <section>
            <h2>Áudio</h2>
            <audio controls src="midias/audio.mp3"></audio>

            <h2>Vídeo</h2>
            <video controls src="midias/video.mp4" type="video/mp4" width="400px">Vídeo não encontrado</video>

            <h2>Vídeo do YouTube (externo) - iFrame</h2>
            <iframe 
                src="https://youtu.be/MxQrTo0Qh9Y?si=tENAAe2CDSNICu7L" 
                title="Exemplo de vídeo do YouTube"
                width="560px"
                height="315px"
                frameborder="0">

            </iframe>

        </section>
    </main>
</body>
</html>
