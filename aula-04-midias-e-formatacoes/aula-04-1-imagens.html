<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de fotos</title>
</head>
<body>
    <header>
        <h1>Galeria de fotos</h1>
    </header>
    <main>
        <section>
            <!-- importando imagem local -->
            <img src="midias/imagem.jpg" alt="paisagem" width="300px" height="300px">
            <br><br><br>

            <!-- importando imagens externas -->
            <img src="https://picsum.photos/id/100/300/200" alt="imagem-01">
            <img src="https://picsum.photos/id/200/300/200" alt="imagem-02">
            <img src="https://picsum.photos/id/300/300/200" alt="imagem-03">
            <img src="https://picsum.photos/id/400/300/200" alt="imagem-04">
            <img src="https://picsum.photos/id/500/300/200" alt="imagem-05">
            <img src="https://picsum.photos/id/600/300/200" alt="imagem-06">
            <img src="https://picsum.photos/id/700/300/200" alt="imagem-07">
            <img src="https://picsum.photos/id/800/300/200" alt="imagem-08">
            <img src="https://picsum.photos/id/900/300/200" alt="imagem-09">
            <img src="https://picsum.photos/id/1000/300/200" alt="imagem-10">
            <img src="https://picsum.photos/id/1001/300/200" alt="imagem-11">
            <img src="https://picsum.photos/id/1002/300/200" alt="imagem-12">
        </section>
        <br><br><br>
        <section>
            <!-- Imagem com legenda -->
             <figure>
                <img src="midias/grafico.png" alt="grafico de crescimento anual da empresa" width="300px">
                <figcaption>
                    Gráfico de crescimento da empresa no ano de 2025.
                </figcaption>
             </figure>
        </section>
    </main>
    <hr>
    <footer>
        <p><em>&copy; 2026 - FATEC Registro DSM</em></p>
    </footer>
</body>
</html>
