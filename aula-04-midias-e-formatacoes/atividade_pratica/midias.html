<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechNova Solutions – Apresentação e Mídias</title>
  </head>
  <body>
    <header>
      <h1>TechNova Solutions</h1>
    </header>
    <main>
      <h1>Mensagem importante</h1>
      <p>
        <strong>Atenção:</strong> nosso sistema está em <em>atualização</em> e é
        realmente <mark>importante</mark> acompanhar as mudanças.
      </p>

      <section>
        <figure>
          <img
            src="midias_atividade/download (1).jpg"
            alt="Imagem ilustrativa de tecnologia"
            width="600"
          />
          <figcaption>
            Figura 1: Representação visual da inovação tecnológica.
          </figcaption>
        </figure>

        <br />

        <audio
          controls
          fallback="Este áudio não é suportado por este navegador"
        >
          <source src="midias_atividade/audio.mp3" type="audio/mp3" />
        </audio>

        <br />

        <video
          controls
          src="midias_atividade/video.mp4"
          type="video/mp4"
          width="400px"
          fallback="Este vídeo não é suportado por este navegador"
        >
          <source src="midias_atividade/video.mp4" type="video/mp4" />
        </video>

        <br />

        <iframe
          width="1013"
          height="570"
          src="https://www.youtube.com/embed/wfcfX1QSSqg"
          title="2 devs especialistas vs. 1 full-stack: quem faz o melhor jogo?"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
          fallback="Este vídeo do YouTube não pode ser exibido neste navegador"
        >
        </iframe>

        <br />

        <svg
          width="500"
          height="900"
          viewBox="0 0 14 13"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <title>Círculo Rosa de Exemplo</title>
          <circle cx="7" cy="6.5" r="5" fill="#F97DBD" />
        </svg>
      </section>
    </main>
  </body>
</html>
