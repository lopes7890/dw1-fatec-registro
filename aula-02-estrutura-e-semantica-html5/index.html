<!-- Estrutura básica HTML -->

<!doctype html>
<!-- Diz ao navegador a ultima versão do html -->

<html lang="pt-br">
  <!-- Atributo lang informa o idioma do site -->

  <!-- no head irão as metatags -->
  <head>
    <!-- charset indica o conjunto de caracteres -->
    <meta charset="UTF-8" />
    <!-- permite apresentar uma melhor visualização em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial scale=1.0" />
    <!-- título exibido na barra do navegador -->
    <title>Meu website</title>
  </head>

  <!-- Conteúdo do site -->

  <body>
    <h1>Meu site</h1>
    <p>Bem-vindo ao meu site!</p>

    <strong>Texto em negrito importante</strong>
  </body>
</html>
